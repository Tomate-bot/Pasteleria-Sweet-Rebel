spring.application.name=pasteleria

server.port=${SERVER_PORT:8082}
server.address=${SERVER_ADDRESS:0.0.0.0}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pasteleria}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.error.include-message=never

jwt.secret=${JWT_SECRET:mX8pL2vQ9nR5aT7yK3wB6zH1cD4eF0gJ8sN2uV5xYqA}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
# --- Correo de recuperación: requiere las variables MAIL_HOST, MAIL_USER y MAIL_PASSWORD ---
app.mail.from=${MAIL_FROM:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- PayPal. paypal.mode: simulado (por defecto: sin credenciales y sin dinero), sandbox o live ---
paypal.mode=${PAYPAL_MODE:simulado}
paypal.client-id=${PAYPAL_CLIENT_ID:}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
paypal.webhook-id=${PAYPAL_WEBHOOK_ID:}
paypal.app-url=${APP_URL:http://localhost:5173}
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
