server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # Igual que el proxy de Vite: el navegador solo habla con este servidor y /api pasa al backend (sin CORS).
  location /api/ { proxy_pass http://backend:8082; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header Origin ""; }
  location = /aviso-privacidad.html { proxy_pass http://backend:8082; }
  location / { try_files $uri /index.html; }
}
